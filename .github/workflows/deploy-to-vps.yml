name: Deploy to VPS

on:
  push:
    branches:
      - vps # Trigger only on pushes to the VPS branch

jobs:
  deploy:
    runs-on: ubuntu-latest # This runner will primarily be used to SSH

    steps:
      - name: Checkout code (Optional but Recommended)
        uses: actions/checkout@v3

      - name: SSH to VPS and Deploy
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            echo "Starting deployment process on VPS..."
            cd /var/www/projects/communet.ca/Community-Connect-App

            echo "Pulling the latest changes..."
            git pull origin vps

            echo "Installing frontend dependencies and building..."
            cd packages/frontend
            npm install
            npm run build
            pm2 stop communet-frontend || true
            pm2 delete communet-frontend || true
            pm2 start npm --name "communet-frontend" -- run start

            echo "Installing backend dependencies, generating Prisma client, running migrations, and building..."
            cd ../backend
            npm install
            npx prisma generate
            npx prisma migrate deploy --schema=./prisma/schema.prisma # Specify schema path if needed
            npm run build
            pm2 stop communet-backend || true
            pm2 delete communet-backend || true
            pm2 start npm --name "communet-backend" -- run start:prod

            echo "Deployment complete!"