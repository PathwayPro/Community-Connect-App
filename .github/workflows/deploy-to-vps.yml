name: Deploy to VPS

on:
  push:
    branches:
      - vps # Trigger only on pushes to the VPS branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Or your desired Node.js version

      - name: Install pm2
        run: npm install -g pm2

      - name: Install dependencies and build (Frontend)
        run: |
          cd packages/frontend
          npm install
          npm run build
          pm2 stop communect-frontend || true
          pm2 delete communect-frontend || true
          pm2 start npm --name "communect-frontend" -- run start

      - name: Install dependencies, generate prisma client, run migrations, and build (Backend)
        run: |
          cd packages/backend
          npm install
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          pm2 stop communect-backend || true
          pm2 delete communect-backend || true
          pm2 start npm --name "communect-backend" -- run start:prod

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          script: |
            #copy the built files to the correct directories.
            # rsync -avz ./frontend/build/* ${{ secrets.VPS_DEPLOY_PATH }}/frontend/build/
            # rsync -avz ./backend/dist/* ${{ secrets.VPS_DEPLOY_PATH }}/backend/dist/
            #restart pm2 processes.
            pm2 restart communect-frontend
            pm2 restart communect-backend