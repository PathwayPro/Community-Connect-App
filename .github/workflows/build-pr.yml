name: Build Pull Request

on:
  pull_request:
    branches:
      - vps

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Cache Node.js dependencies # Cache for node_modules to make build faster
        uses: actions/cache@v3
        with:
          path: |
            packages/frontend/node_modules
            packages/backend/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Frontend - Install Dependencies
        run: |
          cd packages/frontend
          npm install

      - name: Frontend - Build
        run: |
          cd packages/frontend
          npm run build

      - name: Backend - Install Dependencies
        run: |
          cd packages/backend
          npm install

      - name: Backend - Generate Prisma Client
        run: |
          cd packages/backend
          npm run build
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Backend - Build
        run: |
          cd packages/backend
          npm run build